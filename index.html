<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Navy Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010408;
    display:flex;
    justify-content:center;
    align-items:center;
}


.stage-container{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#010408;
}


.bg-image{
    height:100%;
    width:auto;
    max-width:100%;
    object-fit:contain;
    display:block;
    z-index:10;
}


/* Matrix lateral */

.matrix-canvas{
    position:absolute;
    top:0;
    width:25vw;
    height:100vh;
    z-index:5;
    pointer-events:none;
    opacity:.65;
}

#matrix-left{
    left:0;
}

#matrix-right{
    right:0;
}


/* Vídeo */

#introVideo{

    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    object-fit:cover;

    background:#000;

    z-index:9999;

    transition:opacity .5s;
}



/* Botão */

.game-button{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:320px;
    height:85px;

    background:#070d18;

    border:2px solid #233856;

    box-shadow:
    inset 0 0 15px rgba(0,162,255,.4),
    0 6px 20px rgba(0,0,0,.95);

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    font-family:"Courier New",monospace;

    font-weight:bold;

    font-size:20px;

    color:#d0e8ff;

    letter-spacing:2px;

    text-shadow:
    0 0 8px rgba(0,162,255,.9),
    0 2px 4px #000;


    opacity:0;

    animation:
    fadeButton .8s forwards .3s;

    z-index:50;

}


@keyframes fadeButton{

from{
opacity:0;
transform:translate(-50%,-40%);
}

to{
opacity:1;
transform:translate(-50%,-50%);
}

}


.game-button:hover{

background:#0d1727;
border-color:#00a2ff;

}


.game-button:active{

transform:translate(-50%,-50%) scale(.98);

}



/* Tela inicial */

#audio-overlay{

position:fixed;

top:0;
left:0;

width:100vw;
height:100vh;

background:rgba(2,5,9,.95);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:10000;

cursor:pointer;

transition:.4s;

}


#audio-overlay h2{

color:#d0e8ff;

font-family:"Courier New",monospace;

font-size:clamp(18px,2.5vw,32px);

letter-spacing:3px;

text-align:center;

text-shadow:
0 0 15px rgba(0,162,255,.8);

margin-bottom:12px;

}


#audio-overlay p{

color:#8ab4f8;

font-family:Arial;

font-size:14px;

}



/* MOBILE */

@media(max-width:768px){

.stage-container{

width:100vw;
height:100vh;

}


.bg-image{

width:100%;
height:100%;

object-fit:cover;

}


.matrix-canvas{

display:none;

}


.game-button{

width:82%;

max-width:320px;

height:70px;

font-size:16px;

letter-spacing:1px;

top:72%;

}

}



@media(max-width:400px){

.game-button{

width:85%;

height:60px;

font-size:14px;

top:75%;

}

}


</style>

</head>


<body>


<div id="audio-overlay" onclick="startVideoPlayback()">

<h2>
CLIQUE PARA INICIAR O JOGO
</h2>

<p>
[ Iniciar Apresentação em Tela Cheia ]
</p>

</div>



<video id="introVideo" playsinline preload="auto"></video>




<div class="stage-container" id="mainStage" style="display:none;">


<canvas id="matrix-left" class="matrix-canvas"></canvas>

<canvas id="matrix-right" class="matrix-canvas"></canvas>



<picture>

<source media="(max-width:768px)"
srcset="assets/background_mobile.webp">


<img src="assets/background.webp"
class="bg-image">

</picture>




<a id="gameLinkBtn"
href="#"
class="game-button"
target="_blank">

✦ ENTRAR NO JOGO ✦

</a>


</div>




<script>


const video=document.getElementById("introVideo");

const overlay=document.getElementById("audio-overlay");

const mainStage=document.getElementById("mainStage");



/* ESCOLHE O VIDEO CONFORME O DISPOSITIVO */

function loadIntroVideo(){

let mobile = window.matchMedia("(max-width:768px)").matches;


if(mobile){

video.src="assets/intro_mobile.mp4";

}else{

video.src="assets/intro.mp4";

}


video.load();

}


loadIntroVideo();





function startVideoPlayback(){


overlay.style.opacity="0";


setTimeout(()=>{

overlay.style.display="none";

},400);



video.muted=false;


video.play().catch(()=>{

video.muted=true;

video.play();

});


}





function initMatrixEffect(id){


const canvas=document.getElementById(id);

const ctx=canvas.getContext("2d");


canvas.width=canvas.offsetWidth;

canvas.height=canvas.offsetHeight;



const chars=
"01ABCDEF-TARGET-RADAR-LOCK-NAV-GRID-STATUS-ACTIVE";


const size=13;


const columns=Math.floor(canvas.width/size);


const drops=[];


for(let i=0;i<columns;i++){

drops[i]=1;

}



function draw(){


ctx.fillStyle="rgba(1,4,8,.12)";

ctx.fillRect(0,0,canvas.width,canvas.height);



ctx.fillStyle="#00ff66";

ctx.font=size+"px monospace";



for(let i=0;i<drops.length;i++){


let txt=
chars.charAt(
Math.floor(Math.random()*chars.length)
);



ctx.fillText(
txt,
i*size,
drops[i]*size
);



if(drops[i]*size>canvas.height &&
Math.random()>.975){

drops[i]=0;

}


drops[i]++;

}


}


return setInterval(draw,35);


}






video.addEventListener("ended",()=>{


video.style.opacity="0";


setTimeout(()=>{


video.style.display="none";


mainStage.style.display="flex";


initMatrixEffect("matrix-left");

initMatrixEffect("matrix-right");


},500);


});






window.addEventListener("DOMContentLoaded",()=>{


fetch("assets/game-link.txt")

.then(r=>r.text())

.then(link=>{


document.getElementById("gameLinkBtn").href=
link.trim();


})


.catch(err=>{

console.warn(err);

});


});



</script>


</body>
</html>
